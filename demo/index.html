<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fayette County Incarceration Disparity Explorer</title>
  
  <!-- Tableau JS API -->
  <script type="text/javascript" src="https://public.tableau.com/javascripts/api/tableau-2.min.js"></script>

  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --text-color: #1a1a1a;
      --border-color: #ccc;
      --bg-gray: #f8f9fa;
    }

    body {
      font-family: var(--font-family);
      margin: 0;
      padding: 24px;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-container {
      max-width: 950px;
      width: 100%;
    }

    .sentence-builder {
      font-size: 1.25rem;
      line-height: 1.8;
      margin-bottom: 24px;
      background: var(--bg-gray);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .sentence-builder select {
      font-size: 1.05rem;
      font-weight: 600;
      padding: 4px 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: #ffffff;
      color: #0056b3;
      cursor: pointer;
    }

    .dynamic-val {
      font-weight: 700;
      color: #d9381e;
      border-bottom: 2px dashed #d9381e;
      padding: 0 4px;
    }

    .dynamic-target {
      font-weight: 600;
      color: #2b6cb0;
      border-bottom: 1px solid #2b6cb0;
    }

    /* 3x2 Grid Layout matching attached screenshot */
    .heatmap-layout {
      display: grid;
      grid-template-columns: 110px 1fr 120px;
      grid-template-rows: 90px 1fr;
      gap: 12px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    .corner-spacer {
      grid-column: 1;
      grid-row: 1;
    }

    /* Top Rotated Age Labels Header */
    .top-labels {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: flex-end;
      padding-bottom: 4px;
    }

    .top-labels .label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-weight: 600;
      font-size: 0.85rem;
      text-align: left;
      white-space: nowrap;
      justify-self: center;
    }

    /* Left Side Sex Labels */
    .side-labels-left {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      text-align: right;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .side-labels-left .gender-group {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 48%;
      border-right: 3px solid #333;
      padding-right: 10px;
    }

    /* Right Side Race Labels */
    .side-labels-right {
      grid-column: 3;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      text-align: left;
      font-weight: 600;
      font-size: 0.85rem;
      border-left: 3px solid #333;
      padding-left: 10px;
    }

    .side-labels-right .race-label {
      display: flex;
      align-items: center;
      height: 23%;
    }

    /* Embedded Tableau Canvas Wrapper */
    .tableau-wrapper {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      width: 100%;
      min-height: 450px;
    }

    #tableauViz {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div class="hero-container">
  <!-- Interactive Dynamic Sentence -->
  <div class="sentence-builder">
    On 
    <select id="dateSelect">
      <option value="2026-09-03" selected>September 3, 2026</option>
    </select> 
    in Fayette County, Kentucky:<br/>
    A/An 
    <select id="ageSelect">
      <option value="18-24">18–24</option>
      <option value="25-34">25–34</option>
      <option value="35-44">35–44</option>
      <option value="45-54">45–54</option>
      <option value="55-64">55–64</option>
      <option value="65+">65+</option>
    </select> 
    year old 
    <select id="raceSelect">
      <option value="Black">Black</option>
      <option value="Hispanic">Hispanic</option>
      <option value="White">White</option>
      <option value="Other">Other</option>
    </select> 
    <select id="sexSelect">
      <option value="Female">Female</option>
      <option value="Male" selected>Male</option>
    </select> 
    was <span id="multiplier" class="dynamic-val">1.0x</span> 
    more likely to be incarcerated at FCDC than a/an 
    <span id="targetDemographic" class="dynamic-target">average person</span>.
  </div>

  <!-- Heatmap & Overlay Grid -->
  <div class="heatmap-layout">
    <div class="corner-spacer"></div>

    <!-- Rotated Column Headers (Top: Age Groups) -->
    <div class="top-labels">
      <div class="label">18–24</div>
      <div class="label">25–34</div>
      <div class="label">35–44</div>
      <div class="label">45–54</div>
      <div class="label">55–64</div>
      <div class="label">65+</div>
      <div class="label" style="font-weight: 800;">ALL</div>
    </div>

    <!-- Left Row Headers (Sex) -->
    <div class="side-labels-left">
      <div class="gender-group"><span>Female</span></div>
      <div class="gender-group"><span>Male</span></div>
    </div>

    <!-- Embedded Tableau Viz Container -->
    <div class="tableau-wrapper">
      <div id="tableauViz"></div>
    </div>

    <!-- Right Row Headers (Race) -->
    <div class="side-labels-right">
      <div class="race-label"><span>Black</span></div>
      <div class="race-label"><span>Hispanic</span></div>
      <div class="race-label"><span>White</span></div>
      <div class="race-label"><span>Other</span></div>
    </div>
  </div>
</div>

<script>
  let viz, workbook;

  const vizUrl = "https://public.tableau.com/views/demo_17890907558550/A?:language=en-US&:sid=&:redirect=auth&:display_count=n&:origin=viz_share_link";

  function initViz() {
    const containerDiv = document.getElementById("tableauViz");
    const options = {
      hideTabs: true,
      hideToolbar: true,
      onFirstInteractive: function () {
        workbook = viz.getWorkbook();
        viz.addEventListener(tableau.TableauEventName.MARKS_SELECTION, onMarkSelection);
      }
    };

    viz = new tableau.Viz(containerDiv, vizUrl, options);
  }

  function updateTableauParameters() {
    if (!workbook) return;

    const age = document.getElementById("ageSelect").value;
    const race = document.getElementById("raceSelect").value;
    const sex = document.getElementById("sexSelect").value;
    const date = document.getElementById("dateSelect").value;

    workbook.changeParameterValueAsync("Param_Age", age);
    workbook.changeParameterValueAsync("Param_Race", race);
    workbook.changeParameterValueAsync("Param_Sex", sex);
    workbook.changeParameterValueAsync("Param_Date", date);
  }

  function onMarkSelection(marksEvent) {
    return marksEvent.getMarksAsync().then(function (marks) {
      if (marks.length === 0) {
        document.getElementById("multiplier").innerText = "1.0x";
        document.getElementById("targetDemographic").innerText = "average person";
        return;
      }

      const pairs = marks[0].getPairs();
      let hoveredVal = "1.0x";
      let hAge = "", hRace = "", hSex = "";

      pairs.forEach(function (pair) {
        const field = pair.fieldName.toLowerCase();
        if (field.includes("disparity_ratio") || field.includes("ratio") || field.includes("multiplier")) {
          hoveredVal = parseFloat(pair.formattedValue).toFixed(1) + "x";
        }
        if (field.includes("age")) hAge = pair.formattedValue;
        if (field.includes("race")) hRace = pair.formattedValue;
        if (field.includes("sex") || field.includes("gender")) hSex = pair.formattedValue;
      });

      let hoveredDemo = "";
      if ((!hAge || hAge === "ALL") && !hRace && !hSex) {
        hoveredDemo = "average person";
      } else {
        const ageStr = (hAge && hAge !== 'ALL') ? `${hAge} year old ` : '';
        const raceStr = hRace ? `${hRace} ` : '';
        const sexStr = hSex || 'person';
        hoveredDemo = `${ageStr}${raceStr}${sexStr}`.trim();
      }

      document.getElementById("multiplier").innerText = hoveredVal;
      document.getElementById("targetDemographic").innerText = hoveredDemo;
    });
  }

  document.getElementById("ageSelect").addEventListener("change", updateTableauParameters);
  document.getElementById("raceSelect").addEventListener("change", updateTableauParameters);
  document.getElementById("sexSelect").addEventListener("change", updateTableauParameters);
  document.getElementById("dateSelect").addEventListener("change", updateTableauParameters);

  document.addEventListener("DOMContentLoaded", initViz);
</script>

</body>
</html>
