<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fayette County Incarceration Disparity Explorer</title>
  
  <!-- Tableau JS API -->
  <script type="text/javascript" src="https://public.tableau.com/javascripts/api/tableau-2.min.js"></script>

  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: #121212;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Hero Canvas: Enforces strict 3:2 Aspect Ratio matching grid B2:R11 */
    .hero-container {
      width: 100vw;
      max-width: 1500px;
      aspect-ratio: 3 / 2;
      background-color: #000000; /* Black area (B2-D11 & P2-R11) */
      display: grid;
      grid-template-columns: 2fr 13fr 2fr;
      grid-template-rows: 2.5fr 7.5fr;
      padding: 8px;
    }

    /* Gray Area (Sentence Builder) covering Rows 2-3 across Columns E-O equivalent */
    .sentence-builder-container {
      grid-column: 2;
      grid-row: 1;
      background-color: #808080; /* Gray area */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .sentence-builder {
      font-size: 1.05rem;
      line-height: 1.4;
      color: #000;
      text-align: center;
      font-weight: 500;
    }

    .sentence-builder select {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 2px 6px;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #ffffff;
      color: #0056b3;
      cursor: pointer;
    }

    .dynamic-val {
      font-weight: 700;
      color: #b91c1c;
      border-bottom: 2px dashed #b91c1c;
      padding: 0 4px;
    }

    .dynamic-target {
      font-weight: 700;
      color: #1d4ed8;
      border-bottom: 1px solid #1d4ed8;
    }

    /* Heatmap Overlay Area (Rows 4-11, Columns E-O) */
    .heatmap-grid {
      grid-column: 2;
      grid-row: 2;
      display: grid;
      /* Exactly 11 columns matching Tableau heatmap structure */
      grid-template-columns: repeat(11, 1fr);
      /* Row 4 (headers) + 7 rows for data (Rows 5-11) */
      grid-template-rows: 35px repeat(7, 1fr);
      position: relative;
      background-color: #ffffff;
    }

    /* Tableau Visualization exact placement underneath HTML overlay labels */
    .tableau-wrapper {
      grid-column: 1 / span 11;
      grid-row: 1 / span 8;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #tableauViz {
      width: 100%;
      height: 100%;
    }

    /* HTML Overlay Cell Styling */
    .cell-label {
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      color: #000000;
      pointer-events: none; /* Allows clicks to pass through to Tableau viz */
      user-select: none;
    }

    .header-label {
      background-color: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid #ccc;
      font-size: 0.85rem;
    }

    .row-label {
      background-color: rgba(255, 255, 255, 0.85);
      font-size: 0.85rem;
    }

    /* Specific Grid Alignments for HTML-rendered labels */
    /* Row 4 Header Labels */
    .lbl-E4 { grid-column: 1; grid-row: 1; }
    .lbl-F4 { grid-column: 2; grid-row: 1; }
    .lbl-G4 { grid-column: 3; grid-row: 1; }
    .lbl-H4 { grid-column: 4; grid-row: 1; }
    .lbl-I4 { grid-column: 5; grid-row: 1; }
    .lbl-J4 { grid-column: 6; grid-row: 1; font-weight: 900; }
    .lbl-K4 { grid-column: 7; grid-row: 1; }
    .lbl-L4 { grid-column: 8; grid-row: 1; }
    .lbl-M4 { grid-column: 9; grid-row: 1; }
    .lbl-N4 { grid-column: 10; grid-row: 1; }
    .lbl-O4 { grid-column: 11; grid-row: 1; }

    /* Column J Age Labels (Rows 5 to 10) */
    .lbl-J5 { grid-column: 6; grid-row: 3; }
    .lbl-J6 { grid-column: 6; grid-row: 4; }
    .lbl-J7 { grid-column: 6; grid-row: 5; }
    .lbl-J8 { grid-column: 6; grid-row: 6; }
    .lbl-J9 { grid-column: 6; grid-row: 7; }
    .lbl-J10 { grid-column: 6; grid-row: 8; }

    /* Row 11 Average Label */
    .lbl-J11 { grid-column: 6; grid-row: 9; font-size: 0.8rem; font-weight: 900; }

  </style>
</head>
<body>

<div class="hero-container">

  <!-- Gray Sentence Area (Cells E2-O3 equivalent) -->
  <div class="sentence-builder-container">
    <div class="sentence-builder">
      On 
      <select id="dateSelect">
        <option value="2026-09-03" selected>September 3, 2026</option>
      </select> 
      in Fayette County, Kentucky: 
      A/An 
      <select id="ageSelect">
        <option value="18-24">18–24</option>
        <option value="25-34">25–34</option>
        <option value="35-44">35–44</option>
        <option value="45-54">45–54</option>
        <option value="55-64">55–64</option>
        <option value="65+">65+</option>
      </select> 
      year old 
      <select id="raceSelect">
        <option value="Black">Black</option>
        <option value="Hispanic">Hispanic</option>
        <option value="White">White</option>
        <option value="Other">Other</option>
      </select> 
      <select id="sexSelect">
        <option value="Female">Female</option>
        <option value="Male" selected>Male</option>
      </select> 
      was <span id="multiplier" class="dynamic-val">1.0x</span> 
      more likely to be incarcerated at FCDC than a/an 
      <span id="targetDemographic" class="dynamic-target">average person</span>.
    </div>
  </div>

  <!-- Heatmap & Overlay Grid (Cells E4-O11) -->
  <div class="heatmap-grid">
    
    <!-- Tableau Embed Layer -->
    <div class="tableau-wrapper">
      <div id="tableauViz"></div>
    </div>

    <!-- Bold Header Labels Layer (Row 4) -->
    <div class="cell-label header-label lbl-E4">O</div>
    <div class="cell-label header-label lbl-F4">W</div>
    <div class="cell-label header-label lbl-G4">H</div>
    <div class="cell-label header-label lbl-H4">B</div>
    <div class="cell-label header-label lbl-I4">F</div>
    <div class="cell-label header-label lbl-J4">AVG</div>
    <div class="cell-label header-label lbl-K4">M</div>
    <div class="cell-label header-label lbl-L4">B</div>
    <div class="cell-label header-label lbl-M4">H</div>
    <div class="cell-label header-label lbl-N4">W</div>
    <div class="cell-label header-label lbl-O4">O</div>

    <!-- Bold Column J Labels (Rows 5-10) -->
    <div class="cell-label row-label lbl-J5">18-24</div>
    <div class="cell-label row-label lbl-J6">25-34</div>
    <div class="cell-label row-label lbl-J7">35-44</div>
    <div class="cell-label row-label lbl-J8">45-54</div>
    <div class="cell-label row-label lbl-J9">55-64</div>
    <div class="cell-label row-label lbl-J10">65+</div>

    <!-- Bold Bottom Label (Row 11) -->
    <div class="cell-label row-label lbl-J11">AVERAGE</div>

  </div>
</div>

<script>
  let viz, workbook;

  const vizUrl = "https://public.tableau.com/views/demo_17890907558550/Dashboard4?:language=en-US&:sid=&:redirect=auth&:display_count=n&:origin=viz_share_link&:embed=y&:render=true&:device=desktop"; 
  
  function initViz() {
    const containerDiv = document.getElementById("tableauViz");
    const options = {
      hideTabs: true,
      hideToolbar: true,
      device: "desktop",
      onFirstInteractive: function () {
        workbook = viz.getWorkbook();
        viz.addEventListener(tableau.TableauEventName.MARKS_SELECTION, onMarkSelection);
      }
    };

    viz = new tableau.Viz(containerDiv, vizUrl, options);
  }

  function updateTableauParameters() {
    if (!workbook) return;

    const age = document.getElementById("ageSelect").value;
    const race = document.getElementById("raceSelect").value;
    const sex = document.getElementById("sexSelect").value;
    const date = document.getElementById("dateSelect").value;

    workbook.changeParameterValueAsync("Param_Age", age);
    workbook.changeParameterValueAsync("Param_Race", race);
    workbook.changeParameterValueAsync("Param_Sex", sex);
    workbook.changeParameterValueAsync("Param_Date", date);
  }

  function onMarkSelection(marksEvent) {
    return marksEvent.getMarksAsync().then(function (marks) {
      if (marks.length === 0) {
        document.getElementById("multiplier").innerText = "1.0x";
        document.getElementById("targetDemographic").innerText = "average person";
        return;
      }

      const pairs = marks[0].getPairs();
      let hoveredVal = "1.0x";
      let hAge = "", hRace = "", hSex = "";

      pairs.forEach(function (pair) {
        const field = pair.fieldName.toLowerCase();
        if (field.includes("disparity_ratio") || field.includes("ratio") || field.includes("multiplier")) {
          hoveredVal = parseFloat(pair.formattedValue).toFixed(1) + "x";
        }
        if (field.includes("age")) hAge = pair.formattedValue;
        if (field.includes("race")) hRace = pair.formattedValue;
        if (field.includes("sex") || field.includes("gender")) hSex = pair.formattedValue;
      });

      let hoveredDemo = "";
      if ((!hAge || hAge === "ALL") && !hRace && !hSex) {
        hoveredDemo = "average person";
      } else {
        const ageStr = (hAge && hAge !== 'ALL') ? `${hAge} year old ` : '';
        const raceStr = hRace ? `${hRace} ` : '';
        const sexStr = hSex || 'person';
        hoveredDemo = `${ageStr}${raceStr}${sexStr}`.trim();
      }

      document.getElementById("multiplier").innerText = hoveredVal;
      document.getElementById("targetDemographic").innerText = hoveredDemo;
    });
  }

  document.getElementById("ageSelect").addEventListener("change", updateTableauParameters);
  document.getElementById("raceSelect").addEventListener("change", updateTableauParameters);
  document.getElementById("sexSelect").addEventListener("change", updateTableauParameters);
  document.getElementById("dateSelect").addEventListener("change", updateTableauParameters);

  document.addEventListener("DOMContentLoaded", initViz);
</script>

</body>
</html>
