<!-- Official Tableau JavaScript API v2 -->
<script type="text/javascript" src="https://public.tableau.com/javascripts/api/tableau-2.min.js"></script>

<script>
    // Global Tableau API References & State
    let viz = null;
    let workbook = null;
    let isVizReady = false;
    let selectedCell = { row: 2, col: 10 }; // Default: 18-24 White Man (Row 2, Col 10)
    let rriCache = {}; // In-memory map: "row_col" -> RRI numeric value

    // 1. Matrix Population Definitions (8 Rows x 11 Columns)
    const COL_MAP = {
        1:  { race: "OTHER",    sex: "F",   desc: "OTHER WOMAN" },
        2:  { race: "WHITE",    sex: "F",   desc: "WHITE WOMAN" },
        3:  { race: "HISPANIC", sex: "F",   desc: "HISPANIC WOMAN" },
        4:  { race: "BLACK",    sex: "F",   desc: "BLACK WOMAN" },
        5:  { race: "ALL",      sex: "F",   desc: "FEMALE" },
        6:  { race: "ALL",      sex: "ALL", desc: "PERSON" },
        7:  { race: "ALL",      sex: "M",   desc: "MALE" },
        8:  { race: "BLACK",    sex: "M",   desc: "BLACK MAN" },
        9:  { race: "HISPANIC", sex: "M",   desc: "HISPANIC MAN" },
        10: { race: "WHITE",    sex: "M",   desc: "WHITE MAN" },
        11: { race: "OTHER",    sex: "M",   desc: "OTHER MAN" }
    };

    const ROW_MAP = {
        1: { age: "ALL",   prefix: "An average" },
        2: { age: "18-24", prefix: "An" },
        3: { age: "25-34", prefix: "A" },
        4: { age: "35-44", prefix: "A" },
        5: { age: "45-54", prefix: "A" },
        6: { age: "55-64", prefix: "A" },
        7: { age: "65+",   prefix: "A" },
        8: { age: "ALL",   prefix: "An average" }
    };

    // Initialize HTML Interactive Grid & Tableau Viz on DOM Load
    document.addEventListener("DOMContentLoaded", () => {
        buildInteractiveGrid();
        initTableauViz();
    });

    // 2. Build 88 Interactive Grid Overlay Cells
    function buildInteractiveGrid() {
        const gridContainer = document.getElementById("interactive-grid");
        gridContainer.innerHTML = "";

        for (let r = 1; r <= 8; r++) {
            for (let c = 1; c <= 11; c++) {
                const cell = document.createElement("div");
                cell.className = "cell-overlay";
                cell.dataset.row = r;
                cell.dataset.col = c;

                if (r === selectedCell.row && c === selectedCell.col) {
                    cell.classList.add("selected");
                }

                cell.addEventListener("click", () => onCellClick(r, c));
                gridContainer.appendChild(cell);
            }
        }
    }

    // 3. Initialize Tableau Viz & Handshake
    function initTableauViz() {
        const containerDiv = document.getElementById("tableauViz");
        const url = "https://public.tableau.com/views/demo_17890907558550/Dashboard4";
        
        const options = {
            hideTabs: true,
            hideToolbar: true,
            width: "100%",
            height: "100%",
            onFirstInteractive: function () {
                workbook = viz.getWorkbook();
                isVizReady = true;
                // Pre-fetch RRI data from Tableau into cache and update sentence
                fetchTableauRRIData().then(() => {
                    updateSentenceCard();
                });
            }
        };

        viz = new tableau.Viz(containerDiv, url, options);
    }

    // 4. Fetch Summary Data from Tableau Sheets to Populate Cache
    async function fetchTableauRRIData() {
        if (!isVizReady || !workbook) return;

        const activeSheet = workbook.getActiveSheet();
        let sheets = [];

        if (activeSheet.getSheetType() === tableau.SheetType.DASHBOARD) {
            sheets = activeSheet.getWorksheets();
        } else {
            sheets = [activeSheet];
        }

        rriCache = {}; // Reset cache

        for (const sheet of sheets) {
            try {
                const summaryData = await sheet.getSummaryDataAsync({ maxRows: 0, ignoreSelection: true });
                const columns = summaryData.getColumns();
                const data = summaryData.getData();

                // Find column indices for dimensions & RRI
                let rriIdx = columns.findIndex(c => c.getFieldName().includes("Relative Rate Index") || c.getFieldName().includes("RRI"));
                let ageIdx = columns.findIndex(c => c.getFieldName().includes("Age"));
                let raceIdx = columns.findIndex(c => c.getFieldName().includes("Race"));
                let sexIdx = columns.findIndex(c => c.getFieldName().includes("Sex"));

                data.forEach(row => {
                    let val = rriIdx !== -1 ? row[rriIdx].value : null;
                    let age = ageIdx !== -1 ? row[ageIdx].value : null;
                    let race = raceIdx !== -1 ? row[raceIdx].value : null;
                    let sex = sexIdx !== -1 ? row[sexIdx].value : null;

                    // Match data row back to row_col matrix key
                    let matchedKey = findMatrixKey(age, race, sex);
                    if (matchedKey) {
                        rriCache[matchedKey] = (val !== null && !isNaN(val)) ? parseFloat(val) : null;
                    }
                });
            } catch (err) {
                console.warn("Sheet data extraction note:", err);
            }
        }
    }

    // Helper: Map Tableau dimensions back to (row, col) cell key
    function findMatrixKey(age, race, sex) {
        for (let r = 1; r <= 8; r++) {
            for (let c = 1; c <= 11; c++) {
                let rAge = ROW_MAP[r].age;
                let cRace = COL_MAP[c].race;
                let cSex = COL_MAP[c].sex;

                if (r === 8) {
                    // Row 8 represents overall race populations
                    if (cRace === race && (sex === "ALL" || !sex)) return `${r}_${c}`;
                } else if (rAge === age && cRace === race && cSex === sex) {
                    return `${r}_${c}`;
                }
            }
        }
        return null;
    }

    // 5. Handle Cell Selection (Interaction 1)
    function onCellClick(row, col) {
        selectedCell = { row, col };

        // Highlight selected cell in HTML overlay
        document.querySelectorAll(".cell-overlay").forEach(c => c.classList.remove("selected"));
        const target = document.querySelector(`.cell-overlay[data-row="${row}"][data-col="${col}"]`);
        if (target) target.classList.add("selected");

        updateSentenceCard();
    }

    // 6. Handle Dropdown Changes (Interaction 2: HTML -> Tableau Parameters)
    async function onParameterChange() {
        if (!isVizReady || !workbook) return;

        const ageVal = document.getElementById("select-age").value;
        const raceVal = document.getElementById("select-race").value;
        const sexVal = document.getElementById("select-sex").value;

        // Show loading indicator on sentence panel
        const sentenceCard = document.getElementById("sentence-card");
        const rriValSpan = document.getElementById("rri-value");
        sentenceCard.classList.add("is-loading");
        rriValSpan.classList.add("loading-pulse");

        try {
            // Batch parameter updates asynchronously to prevent visual stutter
            await Promise.all([
                workbook.changeParameterValueAsync("Select Reference Age", ageVal),
                workbook.changeParameterValueAsync("Select Reference Race", raceVal),
                workbook.changeParameterValueAsync("Select Reference Sex", sexVal)
            ]);

            // Re-fetch updated RRI dataset from Tableau & update sentence
            await fetchTableauRRIData();
            updateSentenceCard();
        } catch (err) {
            console.error("Error updating Tableau parameters:", err);
        } finally {
            sentenceCard.classList.remove("is-loading");
            rriValSpan.classList.remove("loading-pulse");
        }
    }

    // 7. Update HTML Sentence Card & RRI Display
    function updateSentenceCard() {
        const r = selectedCell.row;
        const c = selectedCell.col;

        const colInfo = COL_MAP[c];
        const rowInfo = ROW_MAP[r];

        // Format Description & Sex terms
        let prefix = rowInfo.prefix;
        let sexTerm = "MAN";
        if (c === 6 || (r === 8 && (c === 5 || c === 7))) {
            sexTerm = "PERSON";
        } else if (c <= 5) {
            sexTerm = "WOMAN";
        }

        let descText = "";
        if (r === 1 || r === 8) {
            let raceLabel = colInfo.race === "ALL" ? "" : colInfo.race + " ";
            descText = `${raceLabel}${sexTerm}`.trim();
        } else {
            descText = `${rowInfo.age} year old ${colInfo.race} ${sexTerm}`;
        }

        document.getElementById("line2-prefix").innerText = prefix;
        document.getElementById("cell-desc").innerText = descText.toUpperCase();

        // Fetch RRI value from cache
        const cacheKey = `${r}_${c}`;
        const rri = rriCache[cacheKey];

        const rriSpan = document.getElementById("rri-value");
        if (rri !== undefined && rri !== null) {
            rriSpan.innerText = `${rri.toFixed(1)}x`;
            // Dynamic Font Color Rule: > 1.0 -> #67000D, <= 1.0 -> #FFFFFF
            rriSpan.style.color = (rri > 1.0) ? "#67000D" : "#FFFFFF";
        } else {
            rriSpan.innerText = "Suppressed";
            rriSpan.style.color = "#FFFFFF";
        }

        // Adjust Line 4 dropdown article logic ("a" vs "an")
        const ageSelect = document.getElementById("select-age").value;
        document.getElementById("line4-article").innerText = (ageSelect === "18-24") ? "an" : "a";
        document.getElementById("year-old-text").style.display = (ageSelect === "ALL") ? "none" : "inline";
    }
</script>
